<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Narasimhan Rengan, founder of Waypoint. Make every AI work for you.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#C9D1DF"/>
    </pattern>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2458FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2458FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F4F6FA" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#F4F6FA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F4F6FA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#F4F6FA"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="760" height="340" fill="url(#fade)"/>
    <circle cx="1124" cy="196" r="150" fill="url(#halo)"/>

    <text x="80" y="70" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.5" fill="#2458FF">~/graydeveloper01</text>
    <text x="78" y="128" font-family="Onest, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2" fill="#111827">Narasimhan Rengan</text>
    <text x="80" y="168" font-family="Onest, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#5B6475">Founder, <tspan fill="#111827" font-weight="600">Waypoint</tspan>. Make every AI work for you.<tspan class="caret" fill="#2458FF" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"> _</tspan></text>

    <path d="M80 266 C 250 266 330 214 500 222 S 800 272 960 240 S 1090 196 1124 196" fill="none" stroke="#D5DBE6" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="M80 266 C 250 266 330 214 500 222 S 800 272 960 240 S 1090 196 1124 196" pathLength="1" fill="none" stroke="#2458FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="1;1;0" keyTimes="0;0.1;1" dur="2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1"/>
    </path>

  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.467;1" dur="0.75s" begin="0s" fill="freeze"/>
    <circle cx="80" cy="266" r="7" fill="#F4F6FA" stroke="#2458FF" stroke-width="2.5"/>
    <text x="80" y="244" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#111827" font-weight="600">18 years</text>
    <text x="80" y="302" text-anchor="start" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5B6475">systems + product</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.667;1" dur="1.20s" begin="0s" fill="freeze"/>
    <circle cx="500" cy="222" r="7" fill="#F4F6FA" stroke="#2458FF" stroke-width="2.5"/>
    <text x="500" y="200" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#111827" font-weight="600">Bluely.ai</text>
    <text x="500" y="258" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5B6475">cofounder + CEO</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.758;1" dur="1.65s" begin="0s" fill="freeze"/>
    <circle cx="960" cy="240" r="7" fill="#F4F6FA" stroke="#2458FF" stroke-width="2.5"/>
    <text x="960" y="218" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#111827" font-weight="600">Waypoint</text>
    <text x="960" y="276" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5B6475">founder</text>
  </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.826;1" dur="2.30s" begin="0s" fill="freeze"/>
      <circle cx="1124" cy="196" r="9" fill="none" stroke="#2458FF" stroke-width="2" opacity="0">
        <animate attributeName="r" values="9;30" dur="2.2s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="2.2s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1124" cy="196" r="9" fill="#2458FF"/>
      <text x="1124" y="170" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#2458FF">now</text>
    </g>

    <circle r="4" fill="#2458FF" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      <animateMotion dur="5s" begin="2.4s" repeatCount="indefinite" path="M80 266 C 250 266 330 214 500 222 S 800 272 960 240 S 1090 196 1124 196" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
    </circle>
  </g>
</svg>
